services:
  - type: web
    name: tusalama-road-safety
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TUSALAMA_DATABASE_PATH
        value: /tmp/tusalama.sqlite3
      - key: FLASK_COOKIE_SECURE
        value: "1"
